<!doctype html>
<html lang="fr">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Titre du site -->
  <title>Maison Allys | Maison de services lifestyle</title>

  <!-- Description pour Google -->
  <meta
    name="description"
    content="Maison Allys accompagne particuliers, familles et professionnels dans leurs projets : voyages sur mesure, événements, sorties, bien-être et services personnalisés."
  />

  <!-- Auteur -->
  <meta
    name="author"
    content="Maison Allys"
  />

  <!-- Logo Maison Allys comme favicon -->
  <link
    rel="icon"
    type="image/png"
    href="/images/logo.png"
  />

  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Open Graph -->
  <meta
    property="og:title"
    content="Maison Allys | Maison de services lifestyle"
  />

  <meta
    property="og:description"
    content="Maison Allys accompagne particuliers, familles et professionnels dans leurs projets avec discrétion, exigence et attention."
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:url"
    content="https://maisonallys.com"
  />

  <meta
    property="og:image"
    content="https://www.maisonallys.com/images/logo.png"
  />

  <meta
    property="og:site_name"
    content="Maison Allys"
  />

</head>

<body>

  <div id="root"></div>

  <script
    type="module"
    src="/src/main.jsx"
  ></script>

</body>

</html>
